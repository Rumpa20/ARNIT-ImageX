name: Signed Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check signing secrets
        env:
          KEY_BASE64: ${{ secrets.IMAGEX_SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.IMAGEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IMAGEX_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.IMAGEX_SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$KEY_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Configure IMAGEX_SIGNING_KEY_BASE64, IMAGEX_SIGNING_KEY_ALIAS, IMAGEX_SIGNING_KEY_PASSWORD, and IMAGEX_SIGNING_STORE_PASSWORD in repository Actions secrets."
            exit 1
          fi
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Decode signing key
        env:
          KEY_BASE64: ${{ secrets.IMAGEX_SIGNING_KEY_BASE64 }}
        run: echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/imagex-release.jks"
      - name: Align APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v 4 "$APK" "$RUNNER_TEMP/ImageX-aligned.apk"
      - name: Sign APK
        env:
          KEY_ALIAS: ${{ secrets.IMAGEX_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IMAGEX_SIGNING_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.IMAGEX_SIGNING_STORE_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/imagex-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/ARNIT-ImageX-release-signed.apk" \
            "$RUNNER_TEMP/ImageX-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/ARNIT-ImageX-release-signed.apk"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: arnit-imagex-signed-release-apk
          path: ${{ runner.temp }}/ARNIT-ImageX-release-signed.apk
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/imagex-release.jks"

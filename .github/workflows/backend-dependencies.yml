name: Build ImageX Backend Dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - fix/home-account-logo-ui
    - main
    paths:
      - backend/cashfree/composer.json
      - .github/workflows/backend-dependencies.yml

jobs:
  composer-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Install production dependencies
        working-directory: backend/cashfree
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - name: Package vendor directory
        run: zip -r imagex-cashfree-vendor.zip backend/cashfree/vendor
      - uses: actions/upload-artifact@v4
        with:
          name: imagex-cashfree-vendor
          path: imagex-cashfree-vendor.zip
          retention-days: 7
